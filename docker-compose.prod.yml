services:
  postgres:
    image: postgres:17-alpine
    container_name: pukaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pukaar
      POSTGRES_USER: pukaar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pukaar_pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pukaar -d pukaar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pukaar-net

  redis:
    image: redis:7-alpine
    container_name: pukaar-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - pukaar-net

  backend:
    build: ./backend
    container_name: pukaar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pukaar
      DB_USER: pukaar
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      OTP_MOCK_ENABLED: ${OTP_MOCK_ENABLED:-false}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /data/evidence
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      YOURBULKSMS_ENDPOINT: ${YOURBULKSMS_ENDPOINT:-https://control.yourbulksms.net/api/sendhttp.php}
      YOURBULKSMS_AUTH_KEY: ${YOURBULKSMS_AUTH_KEY:-}
      YOURBULKSMS_SENDER: ${YOURBULKSMS_SENDER:-AXPONT}
      YOURBULKSMS_ROUTE: ${YOURBULKSMS_ROUTE:-2}
      YOURBULKSMS_COUNTRY: ${YOURBULKSMS_COUNTRY:-0}
      YOURBULKSMS_DLT_TE_ID: ${YOURBULKSMS_DLT_TE_ID:-}
      YOURBULKSMS_OTP_TEMPLATE: ${YOURBULKSMS_OTP_TEMPLATE:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - pukaar_evidence:/data/evidence
    networks:
      - pukaar-net

volumes:
  pukaar_pg_data:
  pukaar_evidence:

networks:
  pukaar-net:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: pukaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pukaar
      POSTGRES_USER: pukaar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pukaar_pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pukaar -d pukaar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pukaar-net

  redis:
    image: redis:7-alpine
    container_name: pukaar-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - pukaar-net

  backend:
    build: ./backend
    container_name: pukaar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pukaar
      DB_USER: pukaar
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      OTP_MOCK_ENABLED: ${OTP_MOCK_ENABLED:-false}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /data/evidence
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-alert}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      WHATSAPP_SAFE_TEMPLATE_NAME: ${WHATSAPP_SAFE_TEMPLATE_NAME:-}
      WHATSAPP_LOCATION_SCAN_MS: ${WHATSAPP_LOCATION_SCAN_MS:-60000}
      WHATSAPP_SAFE_TEMPLATE_LANGUAGE: ${WHATSAPP_SAFE_TEMPLATE_LANGUAGE:-en}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_LOCATION_UPDATES_ENABLED: ${WHATSAPP_LOCATION_UPDATES_ENABLED:-true}
      WHATSAPP_LOCATION_UPDATE_INTERVAL_SECONDS: ${WHATSAPP_LOCATION_UPDATE_INTERVAL_SECONDS:-120}
      WHATSAPP_LOCATION_UPDATE_MAX_HOURS: ${WHATSAPP_LOCATION_UPDATE_MAX_HOURS:-3}
      YOURBULKSMS_ENDPOINT: ${YOURBULKSMS_ENDPOINT:-https://control.yourbulksms.net/api/sendhttp.php}
      YOURBULKSMS_AUTH_KEY: ${YOURBULKSMS_AUTH_KEY:-}
      YOURBULKSMS_SENDER: ${YOURBULKSMS_SENDER:-AXPONT}
      YOURBULKSMS_ROUTE: ${YOURBULKSMS_ROUTE:-2}
      YOURBULKSMS_COUNTRY: ${YOURBULKSMS_COUNTRY:-0}
      YOURBULKSMS_DLT_TE_ID: ${YOURBULKSMS_DLT_TE_ID:-}
      YOURBULKSMS_OTP_TEMPLATE: ${YOURBULKSMS_OTP_TEMPLATE:-}
      SMS_FALLBACK: ${SMS_FALLBACK:-true}
      VOICE_ESCALATION: ${VOICE_ESCALATION:-true}
      AUTHKEY_ENDPOINT: ${AUTHKEY_ENDPOINT:-https://api.authkey.io/request}
      AUTHKEY_AUTH_KEY: ${AUTHKEY_AUTH_KEY:-}
      AUTHKEY_COUNTRY_CODE: ${AUTHKEY_COUNTRY_CODE:-91}
      AUTHKEY_VOICE_TEMPLATE_ID: ${AUTHKEY_VOICE_TEMPLATE_ID:-}
      AUTHKEY_VOICE_MESSAGE: ${AUTHKEY_VOICE_MESSAGE:-PUKAAR alert. {userName} needs help. Check WhatsApp now for location and details.}
      AUTHKEY_VOICE_DISPLAY_NUMBER: ${AUTHKEY_VOICE_DISPLAY_NUMBER:-+918037126014}
      AUTHKEY_VOICE_ENABLED: ${AUTHKEY_VOICE_ENABLED:-false}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-/secrets/firebase-service-account.json}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-sos-pukar-c74d9}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - pukaar_evidence:/data/evidence
      - /opt/pukaar/secrets:/secrets:ro
    networks:
      - pukaar-net

volumes:
  pukaar_pg_data:
  pukaar_evidence:

networks:
  pukaar-net:
    driver: bridge

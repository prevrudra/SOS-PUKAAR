<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUKAAR Admin</title>
  <style>
    :root { --bg:#0a0a0a; --card:#141414; --border:#2a2a2a; --text:#f5f5f5; --muted:#888; --green:#22c55e; --red:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1100px; margin:0 auto; padding:24px; }
    h1 { margin:0 0 4px; font-size:1.5rem; }
    .sub { color:var(--muted); margin-bottom:24px; font-size:.9rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
    .stat .label { color:var(--muted); font-size:.75rem; text-transform:uppercase; }
    .stat .value { font-size:1.6rem; font-weight:700; margin-top:4px; }
    input, button, select { font:inherit; }
    input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#111; color:var(--text); }
    button { padding:10px 16px; border-radius:8px; border:none; background:var(--green); color:#000; font-weight:600; cursor:pointer; }
    button.secondary { background:#222; color:var(--text); border:1px solid var(--border); }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:middle; }
    th { color:var(--muted); font-weight:600; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tabs button { background:#1a1a1a; color:var(--text); border:1px solid var(--border); }
    .tabs button.active { background:var(--green); color:#000; border-color:var(--green); }
    .hidden { display:none; }
    .err { color:var(--red); font-size:.85rem; margin-top:8px; }
    .login { max-width:400px; margin:80px auto; }
    .filter { margin-bottom:12px; max-width:280px; }
    .player {
      display:flex; align-items:center; gap:10px; min-width:260px;
      background:#111; border:1px solid var(--border); border-radius:999px; padding:6px 10px 6px 6px;
    }
    .player button.playBtn {
      width:34px; height:34px; border-radius:50%; padding:0; flex:none;
      background:var(--green); color:#000; font-size:13px; line-height:34px;
    }
    .player .meta { flex:1; min-width:0; }
    .player .time { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }
    .player .bar { height:4px; background:#2a2a2a; border-radius:999px; overflow:hidden; }
    .player .fill { height:100%; width:0%; background:var(--green); }
    .player.loading .time { color:var(--green); }
  </style>
</head>
<body>
  <div id="loginView" class="wrap login">
    <h1>PUKAAR Admin</h1>
    <p class="sub">Sign in with your admin phone number</p>
    <div class="card">
      <label>Phone (with country code)</label>
      <input id="phone" placeholder="9243894594 or +919243894594" style="margin:8px 0 12px" />
      <p class="sub" style="margin:0 0 8px;font-size:.8rem">10-digit India numbers get +91 automatically</p>
      <div class="row">
        <button onclick="requestOtp()">Send OTP</button>
      </div>
      <input id="otp" placeholder="OTP" style="margin:12px 0" class="hidden" />
      <button id="verifyBtn" onclick="verifyOtp()" class="hidden" style="width:100%">Verify & Login</button>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <div id="dashView" class="wrap hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <div>
        <h1>PUKAAR Admin</h1>
        <p class="sub" id="adminPhone"></p>
      </div>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>

    <div class="grid" id="statsGrid"></div>

    <div class="tabs">
      <button class="active" data-tab="users" onclick="switchTab('users')">Users</button>
      <button data-tab="inactivity" onclick="switchTab('inactivity')">Inactivity</button>
      <button data-tab="recordings" onclick="switchTab('recordings')">Recordings</button>
      <button data-tab="subscriptions" onclick="switchTab('subscriptions')">Subscriptions</button>
      <button data-tab="payments" onclick="switchTab('payments')">Payments</button>
    </div>

    <div class="card">
      <div id="tableUsers"></div>
      <div id="tableInactivity" class="hidden">
        <p class="sub" style="margin-top:0">Set any hours/minutes for testing. Alert is scheduled that many minutes from save.</p>
        <div class="row" style="margin-bottom:12px;gap:12px;align-items:flex-end">
          <div style="flex:1;min-width:180px">
            <label class="sub" style="display:block;margin-bottom:4px">User phone</label>
            <input id="inaPhone" placeholder="9243894594 or +91…" />
          </div>
          <div style="width:90px">
            <label class="sub" style="display:block;margin-bottom:4px">Hours</label>
            <input id="inaHours" type="number" min="0" value="0" />
          </div>
          <div style="width:90px">
            <label class="sub" style="display:block;margin-bottom:4px">Minutes</label>
            <input id="inaMinutes" type="number" min="0" value="5" />
          </div>
          <label class="row" style="gap:6px;margin-bottom:8px">
            <input id="inaEnable" type="checkbox" checked />
            <span class="sub">Enable</span>
          </label>
        </div>
        <div class="row" style="gap:8px;margin-bottom:12px">
          <button onclick="loadInactivityStatus()">Load status</button>
          <button onclick="saveInactivityDuration()">Save duration</button>
          <button class="secondary" onclick="forceInactivityCheck()">Force check now</button>
          <button class="secondary" onclick="presetInactivity(5)">5 min</button>
          <button class="secondary" onclick="presetInactivity(15)">15 min</button>
          <button class="secondary" onclick="presetInactivity(60)">1 hour</button>
          <button class="secondary" onclick="presetInactivity(12*60)">12 hours</button>
        </div>
        <div id="inaErr" class="err"></div>
        <div id="inaStatus" style="margin-top:8px;color:var(--muted);font-size:.9rem;white-space:pre-wrap"></div>
      </div>
      <div id="tableRecordings" class="hidden">
        <div class="filter">
          <input id="recUserFilter" placeholder="Filter by user phone…" oninput="renderRecordings()" />
        </div>
        <div id="recordingsBody"></div>
      </div>
      <div id="tableSubscriptions" class="hidden"></div>
      <div id="tablePayments" class="hidden"></div>
    </div>
  </div>

<script>
// Behind nginx the app lives under /pukaar — origin alone is wrong and causes 401 "Session expired".
const API = (() => {
  const path = window.location.pathname || '';
  if (path.startsWith('/pukaar')) return window.location.origin + '/pukaar';
  return window.location.origin;
})();
let token = localStorage.getItem('pukaar_admin_token') || '';
let recordingsCache = [];

function normalizePhone(raw) {
  let p = (raw || '').trim().replace(/[\s\-()]/g, '');
  if (!p) return p;
  if (p.startsWith('+')) return p;
  if (/^91\d{10}$/.test(p)) return '+' + p;
  if (/^\d{10}$/.test(p)) return '+91' + p;
  return p.startsWith('00') ? '+' + p.slice(2) : p;
}

function headers(includeAuth = true) {
  const h = { 'Content-Type': 'application/json' };
  if (includeAuth && token) h['Authorization'] = 'Bearer ' + token;
  return h;
}

function authOnly() {
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

async function api(path, opts = {}) {
  const isAuthCall = path.startsWith('/api/v1/auth/');
  const res = await fetch(API + path, {
    ...opts,
    headers: { ...headers(!isAuthCall), ...(opts.headers || {}) }
  });
  if (res.status === 401 && !isAuthCall) {
    logout();
    throw new Error('Session expired — please sign in again');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.code || ('Request failed (' + res.status + ')'));
  return data;
}

function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

async function requestOtp() {
  document.getElementById('loginErr').textContent = '';
  document.getElementById('loginErr').style.color = '';
  try {
    const phone = normalizePhone(document.getElementById('phone').value);
    if (!phone) throw new Error('Enter your phone number');
    document.getElementById('phone').value = phone;
    const data = await api('/api/v1/auth/otp/request', {
      method: 'POST',
      body: JSON.stringify({ phone })
    });
    show(document.getElementById('otp'));
    show(document.getElementById('verifyBtn'));
    if (data.devCode) {
      document.getElementById('otp').value = data.devCode;
      document.getElementById('loginErr').style.color = '#22c55e';
      document.getElementById('loginErr').textContent = 'OTP also sent by SMS. Admin code: ' + data.devCode;
    } else {
      document.getElementById('loginErr').textContent = 'OTP sent by SMS to your phone.';
    }
  } catch (e) { document.getElementById('loginErr').textContent = e.message; }
}

async function verifyOtp() {
  document.getElementById('loginErr').textContent = '';
  document.getElementById('loginErr').style.color = '';
  try {
    const phone = normalizePhone(document.getElementById('phone').value);
    const code = (document.getElementById('otp').value || '').trim();
    if (!phone || !code) throw new Error('Enter phone and OTP');
    document.getElementById('phone').value = phone;
    const data = await api('/api/v1/auth/otp/verify', {
      method: 'POST',
      body: JSON.stringify({ phone, code, deviceId: 'admin-web' })
    });
    if (data.user?.role !== 'ADMIN') throw new Error('This account is not an admin. Ask to set ADMIN_PHONE or promote this user.');
    token = data.accessToken;
    localStorage.setItem('pukaar_admin_token', token);
    await loadDashboard(data.user.phone);
  } catch (e) { document.getElementById('loginErr').textContent = e.message; }
}

function logout() {
  token = '';
  localStorage.removeItem('pukaar_admin_token');
  hide(document.getElementById('dashView'));
  show(document.getElementById('loginView'));
}

function openInactivityFor(phone) {
  document.getElementById('inaPhone').value = phone || '';
  switchTab('inactivity');
  if (phone) loadInactivityStatus();
}

function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['users','inactivity','recordings','subscriptions','payments'].forEach(t => {
    const el = document.getElementById('table' + t.charAt(0).toUpperCase() + t.slice(1));
    t === tab ? show(el) : hide(el);
  });
}

function presetInactivity(totalMinutes) {
  document.getElementById('inaHours').value = Math.floor(totalMinutes / 60);
  document.getElementById('inaMinutes').value = totalMinutes % 60;
}

function inaPhoneValue() {
  return normalizePhone(document.getElementById('inaPhone').value);
}

function showInaResult(data, ok) {
  const err = document.getElementById('inaErr');
  const box = document.getElementById('inaStatus');
  err.style.color = ok ? '#22c55e' : '';
  err.textContent = ok ? (data.note || 'OK') : '';
  if (!ok) { box.textContent = ''; return; }
  box.textContent = [
    'User: ' + (data.fullName || '—') + '  ' + (data.phone || ''),
    'User ID: ' + (data.userId || ''),
    'Monitoring: ' + data.inactivityMonitoringEnabled,
    'Duration hours (stored): ' + data.durationHours,
    'Minutes requested: ' + (data.durationMinutesRequested ?? '—'),
    'Last activity: ' + (data.lastActivityAt || '—'),
    'Alert threshold: ' + (data.alertThreshold || '—'),
    'Will alert in: ' + (data.willAlertIn || '—')
  ].join('\n');
}

async function loadInactivityStatus() {
  document.getElementById('inaErr').textContent = '';
  try {
    const phone = inaPhoneValue();
    if (!phone) throw new Error('Enter user phone');
    document.getElementById('inaPhone').value = phone;
    const data = await api('/api/v1/admin/inactivity?phone=' + encodeURIComponent(phone));
    showInaResult(data, true);
    document.getElementById('inaErr').textContent = 'Status loaded';
    if (data.durationHours != null) document.getElementById('inaHours').value = data.durationHours;
  } catch (e) {
    document.getElementById('inaErr').textContent = e.message;
    document.getElementById('inaStatus').textContent = '';
  }
}

async function saveInactivityDuration() {
  document.getElementById('inaErr').textContent = '';
  try {
    const phone = inaPhoneValue();
    if (!phone) throw new Error('Enter user phone');
    document.getElementById('inaPhone').value = phone;
    const hours = parseInt(document.getElementById('inaHours').value || '0', 10) || 0;
    const minutes = parseInt(document.getElementById('inaMinutes').value || '0', 10) || 0;
    if (hours + minutes < 1) throw new Error('Set at least 1 minute total');
    const data = await api('/api/v1/admin/inactivity/duration', {
      method: 'POST',
      body: JSON.stringify({
        phone,
        hours,
        minutes,
        enable: document.getElementById('inaEnable').checked
      })
    });
    showInaResult(data, true);
  } catch (e) {
    document.getElementById('inaErr').textContent = e.message;
  }
}

async function forceInactivityCheck() {
  document.getElementById('inaErr').textContent = '';
  try {
    const phone = inaPhoneValue();
    if (!phone) throw new Error('Enter user phone');
    document.getElementById('inaPhone').value = phone;
    const data = await api('/api/v1/admin/inactivity/check', {
      method: 'POST',
      body: JSON.stringify({ phone })
    });
    document.getElementById('inaErr').style.color = '#22c55e';
    document.getElementById('inaErr').textContent = 'Force check done — if past threshold, WhatsApp should send.';
    await loadInactivityStatus();
  } catch (e) {
    document.getElementById('inaErr').textContent = e.message;
  }
}

function table(headers, rows) {
  const th = headers.map(h => `<th>${h}</th>`).join('');
  const tr = rows.map(r => `<tr>${r.map(c => `<td>${c ?? '—'}</td>`).join('')}</tr>`).join('');
  return `<table><thead><tr>${th}</tr></thead><tbody>${tr || '<tr><td colspan="99">No data</td></tr>'}</tbody></table>`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

let activePlayer = null;

function stopActivePlayer() {
  if (!activePlayer) return;
  try { activePlayer.audio.pause(); } catch (_) {}
  if (activePlayer.timer) clearInterval(activePlayer.timer);
  if (activePlayer.el) {
    activePlayer.el.classList.remove('loading');
    activePlayer.el.querySelector('.playBtn').textContent = '▶';
    activePlayer.el.querySelector('.fill').style.width = '0%';
    const dur = Number(activePlayer.el.dataset.dur || 60);
    activePlayer.el.querySelector('.time').textContent = '0:00 / ' + formatTime(dur);
  }
  activePlayer = null;
}

function audioCell(playUrl, durationSec) {
  const dur = durationSec || 60;
  const src = API + playUrl;
  return `<div class="player" data-url="${src}" data-dur="${dur}">
    <button type="button" class="playBtn" title="Play">▶</button>
    <div class="meta">
      <span class="time">0:00 / ${formatTime(dur)}</span>
      <div class="bar"><div class="fill"></div></div>
    </div>
  </div>`;
}

function attachAudioAuth() {
  document.querySelectorAll('.player').forEach(el => {
    if (el.dataset.bound) return;
    el.dataset.bound = '1';
    const btn = el.querySelector('.playBtn');
    const timeEl = el.querySelector('.time');
    const fill = el.querySelector('.fill');
    const url = el.dataset.url;
    const fallbackDur = Number(el.dataset.dur || 60);
    let audio = null;
    let objectUrl = null;

    btn.addEventListener('click', async () => {
      if (activePlayer && activePlayer.el === el && audio && !audio.paused) {
        stopActivePlayer();
        return;
      }
      stopActivePlayer();
      el.classList.add('loading');
      timeEl.textContent = 'Loading… / ' + formatTime(fallbackDur);
      btn.textContent = '…';
      try {
        const res = await fetch(url, { headers: authOnly() });
        if (!res.ok) throw new Error('Could not load audio (' + res.status + ')');
        const buf = await res.arrayBuffer();
        if (!buf.byteLength) throw new Error('Empty recording file');
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        // Use MPEG-4 MIME so Chrome can parse AAC-in-MP4 duration.
        const blob = new Blob([buf], { type: 'audio/mp4' });
        objectUrl = URL.createObjectURL(blob);
        audio = new Audio();
        audio.preload = 'auto';
        audio.src = objectUrl;

        await new Promise((resolve, reject) => {
          const onReady = () => { cleanup(); resolve(); };
          const onErr = () => { cleanup(); reject(new Error('Browser could not decode this recording')); };
          const cleanup = () => {
            audio.removeEventListener('loadedmetadata', onReady);
            audio.removeEventListener('canplay', onReady);
            audio.removeEventListener('error', onErr);
          };
          audio.addEventListener('loadedmetadata', onReady);
          audio.addEventListener('canplay', onReady);
          audio.addEventListener('error', onErr);
          audio.load();
        });

        const total = (audio.duration && isFinite(audio.duration) && audio.duration > 0)
          ? audio.duration
          : fallbackDur;

        await audio.play();
        btn.textContent = '❚❚';
        el.classList.remove('loading');

        const timer = setInterval(() => {
          if (!audio) return;
          const pos = audio.currentTime || 0;
          const pct = Math.min(100, (pos / total) * 100);
          fill.style.width = pct + '%';
          timeEl.textContent = formatTime(pos) + ' / ' + formatTime(total);
          if (audio.ended || audio.paused) {
            // keep UI until stopActivePlayer for pause; ended handled below
          }
        }, 200);

        audio.onended = () => {
          fill.style.width = '100%';
          timeEl.textContent = formatTime(total) + ' / ' + formatTime(total);
          btn.textContent = '▶';
          if (activePlayer && activePlayer.timer) clearInterval(activePlayer.timer);
          activePlayer = null;
        };

        activePlayer = { el, audio, timer };
      } catch (err) {
        el.classList.remove('loading');
        btn.textContent = '▶';
        timeEl.textContent = '0:00 / ' + formatTime(fallbackDur);
        alert(err.message || 'Playback failed');
      }
    });
  });
}

function renderRecordings() {
  stopActivePlayer();
  const q = (document.getElementById('recUserFilter').value || '').trim().toLowerCase();
  const items = recordingsCache.filter(r =>
    !q || (r.userPhone || '').toLowerCase().includes(q) || (r.userName || '').toLowerCase().includes(q)
  );
  document.getElementById('recordingsBody').innerHTML = table(
    ['User', 'Type', 'Segment', 'Duration', 'Uploaded', 'Listen'],
    items.map(r => [
      `${r.userName || '—'}<br><span style="color:#888">${r.userPhone || ''}</span>`,
      `${r.triggerType || '—'}${r.mockDrill ? ' (drill)' : ''}`,
      `#${(r.index ?? 0) + 1}`,
      `${r.durationSec || 60}s`,
      (r.uploadedAt || '').slice(0, 19).replace('T', ' '),
      audioCell(r.playUrl, r.durationSec)
    ])
  );
  attachAudioAuth();
}

async function loadDashboard(phone) {
  hide(document.getElementById('loginView'));
  show(document.getElementById('dashView'));
  document.getElementById('adminPhone').textContent = phone || '';

  const stats = await api('/api/v1/admin/stats');
  document.getElementById('statsGrid').innerHTML = [
    ['Users', stats.totalUsers],
    ['Active subs', stats.activeSubscriptions],
    ['Paid orders', stats.paidOrders],
    ['Revenue ₹', stats.revenueInr],
    ['Emergencies', stats.totalEmergencies],
    ['Recordings', stats.uploadedRecordings]
  ].map(([l,v]) => `<div class="card stat"><div class="label">${l}</div><div class="value">${v ?? 0}</div></div>`).join('');

  const users = await api('/api/v1/admin/users?size=200');
  document.getElementById('tableUsers').innerHTML = table(
    ['Phone','Name','Role','Protection','Created','Inactivity'],
    users.items.map(u => [
      u.phone,
      u.fullName,
      u.role,
      u.protectionReady,
      (u.createdAt||'').slice(0,10),
      `<button class="secondary" style="padding:4px 10px;font-size:12px" onclick="openInactivityFor('${u.phone||''}')">Set time</button>`
    ])
  );

  const recs = await api('/api/v1/admin/recordings?size=200');
  recordingsCache = recs.items || [];
  renderRecordings();

  const subs = await api('/api/v1/admin/subscriptions');
  document.getElementById('tableSubscriptions').innerHTML = table(
    ['Plan','Status','Price','Ends','Platform'],
    subs.items.map(s => [s.plan, s.status, '₹'+s.priceInr, (s.endsAt||'').slice(0,10), s.storePlatform])
  );

  const pays = await api('/api/v1/admin/payments');
  document.getElementById('tablePayments').innerHTML = table(
    ['Plan','Amount','Status','Order ID','Paid at'],
    pays.items.map(p => [p.plan, '₹'+p.amountInr, p.status, p.razorpayOrderId, (p.paidAt||'').slice(0,16).replace('T',' ')])
  );
}

if (token) {
  api('/api/v1/me').then(u => {
    if (u.role !== 'ADMIN') throw new Error('not admin');
    loadDashboard(u.phone);
  }).catch(() => logout());
}
</script>
</body>
</html>
